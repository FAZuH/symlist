[package]
name = "symlist"
# Version will be updated by CI in `release` branch.
# Avoid modifying version manually or it will break CI


version = "0.1.0"


edition = "2024"
authors = ["FAZuH <mail@fazuh.com>"]
description = "Simple CLI to manage and sync a list of symbolic links"
license = "MIT"
repository = "https://github.com/FAZuH/symlist"
keywords = ["symlink", "symbolic-link", "dotfiles", "filesystem", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
uninlined_format_args = "warn"
new_without_default = "allow"
